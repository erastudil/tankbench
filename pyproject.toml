[project]
name = "tankbench"
version = "0.1.0"
description = "Defensive hardening bench: leaky patient, sealed rounds, alive spec"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Humans and AI" }]
keywords = ["eval", "hardening", "agents", "agpl"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/erastudil/tankbench"
License = "https://github.com/erastudil/tankbench/blob/main/LICENSE"

[project.scripts]
tankbench = "tankbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
